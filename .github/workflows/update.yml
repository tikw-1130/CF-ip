name: Update BestCF IP list

on:
  schedule:
    # 每 30 分钟一次（UTC 整点/半点）。GitHub 高峰期可能延迟几分钟。
    - cron: '*/30 * * * *'
  workflow_dispatch:        # 支持手动触发
  push:
    branches: [main]        # 改了脚本也顺带跑一次
    paths:
      - 'convert.py'
      - '.github/workflows/update.yml'

permissions:
  contents: write

concurrency:
  group: bestcf-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate sorted list
        env:
          SRC_URL: ${{ vars.SRC_URL }}
        run: python3 convert.py --src-env SRC_URL -o ipv4.txt

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ipv4.txt
          if git diff --cached --quiet; then
            echo "内容无变化，跳过提交"
          else
            git commit -m "chore: update ipv4 list ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi

      - name: Summary
        run: |
          {
            echo "### BestCF 更新结果"
            echo ""
            echo "共 **$(wc -l < ipv4.txt)** 条"
            echo ""
            echo '```'
            cat ipv4.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
