name: Update BestCF IP list

on:
  schedule:
    # 每 5 分钟（GitHub 支持的最短间隔）。用 3-58/5 避开整点拥堵，
    # GitHub 官方建议不要在 :00 触发。想更省就改回 */30。
    - cron: '3-58/5 * * * *'
  workflow_dispatch:        # 支持手动触发
  push:
    branches: [main]        # 改了脚本也顺带跑一次
    paths:
      - 'convert.py'
      - '.github/workflows/update.yml'

permissions:
  contents: write

concurrency:
  group: bestcf-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate sorted list
        env:
          SRC_URL: ${{ vars.SRC_URL }}
        run: python3 convert.py --src-env SRC_URL -o ipv4.txt

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- ipv4.txt; then
            echo "内容无变化，跳过提交"
            exit 0
          fi
          git add ipv4.txt
          git commit -m "chore: update ipv4 list ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push

      - name: Summary
        run: |
          {
            echo "### BestCF 更新结果"
            echo ""
            echo "共 **$(wc -l < ipv4.txt)** 条"
            echo ""
            echo '```'
            cat ipv4.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
